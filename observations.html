<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Наблюдения — ННИЦ МО БГУ</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/brand/favicon-180.png">
<link rel="manifest" href="assets/img/brand/site.webmanifest">
<link rel="stylesheet" href="assets/style.css?v=9">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head><body>
<div id="header"></div><script src="assets/layout.js?v=9"></script>

<section class="obs-page"><div class="container"><div class="obs-layout">
  <div class="panel">
    <div class="chart-head">
      <h1 id="chart-title"></h1>
      <div class="seg" id="city"><button data-c="minsk" class="on">Минск</button><button data-c="homel">Гомель</button><button data-c="naroch">Нарочь</button></div>
    </div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div class="chart-ctrl">
      <div class="seg" id="param"><button data-p="total_ozone" class="on">ОСО</button><button data-p="surface_ozone">ПСО</button><button data-p="total_uvi">УФ-индекс</button><button data-p="max_uvi">УФ-макс</button></div>
      <div class="seg" id="range"><button data-d="7" class="on">Неделя</button><button data-d="30">Месяц</button><button data-d="365">Год</button><button data-d="0">Всё время</button></div>
      <button class="export-link" id="exp-toggle">⬇ Скачать данные</button>
    </div>
    <div class="export-box" id="exp">
      <label class="field">С<input type="date" id="from"></label>
      <label class="field">По<input type="date" id="to"></label>
      <button class="btn btn-primary" id="csv">CSV</button>
      <a class="btn btn-ghost" href="#">XLSX</a>
      <span class="muted" style="font-size:13px">все пункты и параметры</span>
    </div>
  </div>
  <aside class="obs-aside">
    <div id="cards" style="display:grid;gap:12px"></div>
    <div class="glossary">
      <h3>Что мы измеряем</h3>
      <div><b>ОСО</b> — общее содержание озона в столбе атмосферы, е.Д. Норма 300–380.</div>
      <div><b>ПСО</b> — приземный озон, концентрация у земли (только Минск).</div>
      <div><b>УФ-индекс</b> — среднедневной ультрафиолет: 0–2 низкий, 3–5 умеренный, 6+ высокий.</div>
      <div><b>УФ-макс</b> — максимум за день, обычно в полдень.</div>
    </div>
  </aside>
</div></div></section>

<div id="footer"></div>
<script>
const $ = id => document.getElementById(id);
const CITY = { minsk: "Минску", homel: "Гомелю", naroch: "Нарочи" };
const NAMES = { minsk: "Минск", homel: "Гомель", naroch: "Нарочь" };
const PARAM = { total_ozone: "ОСО (е.Д.)", surface_ozone: "ПСО", total_uvi: "УФ-индекс", max_uvi: "УФ-макс" };

// карточки: у каждого пункта своя дата последних данных
function renderCards() { $("cards").innerHTML = Object.keys(NAMES).map(k => {
  const oz = lastOf("total_ozone_" + k), uv = lastOf("total_uvi_" + k), mx = lastOf("max_uvi_" + k), so = lastOf("surface_ozone_" + k);
  const [c, l] = uviClass(uv.value);
  return `<div class="st-card ${k === city ? "on" : ""}" onclick="document.querySelector('#city [data-c=${k}]').click()">
  <h3>${NAMES[k]} <span class="asof">${shortDate(oz.date)}</span></h3>
  <div class="kv"><span>ОСО <b>${oz.value}</b></span><span>УФ <b>${uv.value}</b></span><span>УФ-макс <b>${mx.value}</b></span>${so ? `<span>ПСО <b>${so.value}</b></span>` : ""}</div></div>`;
}).join(""); }

let city = "minsk", param = "total_ozone", days = 7, chart;
const seg = (id, fn) => document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
  if (b.disabled) return;
  document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle("on", x === b)); fn(b.dataset); render();
});
seg("city", d => city = d.c);
seg("param", d => param = d.p);
seg("range", d => days = +d.d);

function render() {
  renderCards();
  // ПСО есть только у Минска
  document.querySelector('#param [data-p="surface_ozone"]').disabled = city !== "minsk";
  if (city !== "minsk" && param === "surface_ozone") { param = "total_ozone"; document.querySelectorAll("#param button").forEach(x => x.classList.toggle("on", x.dataset.p === param)); }
  const key = param + "_" + city, lo = lastOf(key);
  // период отсчитываем от последней даты, за которую у пункта есть данные
  const rows = OBS.slice(0, lo.i + 1).slice(days ? -days : 0);
  $("chart-title").innerHTML = `${NAMES[city]} · ${PARAM[param]} <span class="asof">по ${shortDate(lo.date)}</span>`;
  chart?.destroy();
  chart = new Chart($("chart"), {
    type: "line",
    data: { labels: rows.map(o => o.date), datasets: [{ label: PARAM[param], data: rows.map(o => o[key]),
      borderColor: "#0091c2", backgroundColor: "rgba(0,145,194,.08)", fill: true, borderWidth: 2.5, tension: .4, spanGaps: true,
      pointRadius: rows.length <= 31 ? 4 : 0, pointHoverRadius: 6, pointBackgroundColor: "#0091c2" }] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { padding: 10, titleFont: { size: 14 }, bodyFont: { size: 14 } } },
      scales: { x: { grid: { color: "#eef3f6" }, ticks: { font: { size: 13 }, maxTicksLimit: 10, maxRotation: 0 } },
                y: { grid: { color: "#eef3f6" }, ticks: { font: { size: 13 } } } } }
  });
}
$("to").value = OBS[OBS.length - 1].date; $("from").value = OBS[OBS.length - 30].date;
$("exp-toggle").onclick = () => $("exp").classList.toggle("open");
$("csv").onclick = () => downloadCSV(OBS.filter(r => r.date >= $("from").value && r.date <= $("to").value));
render();
</script>
</body></html>
